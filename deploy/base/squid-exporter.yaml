apiVersion: apps/v1
kind: Deployment
metadata:
  name: squid-exporter
  namespace: watcher
  labels:
    app: squid-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: squid-exporter
  template:
    metadata:
      labels:
        app: squid-exporter
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
      - name: watcher-harbor-registry-secret
      containers:
      - name: squid-exporter
        image: harbor.jbnu.ac.kr/jdevops/squid-exporter:REPLACE_WITH_COMMIT_SHA
        env:
          - name: SQUID_EXPORTER_LISTEN
            value: ":9308"
          - name: SQUID_HOSTNAME
            value: "jcode-router-svc.watcher.svc.cluster.local"
          - name: SQUID_PORT
            value: "3000"
          # - name: SQUID_LOGIN
          #   value: "your_username"
          # - name: SQUID_PASSWORD
          #   value: "your_password"
        ports:
        - containerPort: 9308
        startupProbe:
          httpGet:
            path: /metrics
            port: 9308
          periodSeconds: 5
          failureThreshold: 24
        readinessProbe:
          httpGet:
            path: /ready
            port: 9308
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /live
            port: 9308
          periodSeconds: 20
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: squid-exporter-svc
  namespace: watcher
  labels:
    app: squid-exporter
spec:
  selector:
    app: squid-exporter
  ports:
  - name: metrics
    port: 9308
    targetPort: 9308
  type: ClusterIP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: squid-exporter-monitor
  namespace: watcher
  labels:
    app: squid-exporter
    release: prometheus
spec:
  selector:
    matchLabels:
      app: squid-exporter
  namespaceSelector:
    matchNames:
      - watcher
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
