apiVersion: v1
kind: ServiceAccount
metadata:
  name: jcode-workspace-v2
  namespace: watcher
automountServiceAccountToken: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jcode-generator
  namespace: watcher
  labels:
    app: jcode-generator
spec:
  selector:
    matchLabels:
      app: jcode-generator
  template:
    metadata:
      labels:
        app: jcode-generator
    spec:
      serviceAccountName: jcode-workspace-v2
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: jcode-generator
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: jcode-generator
            topologyKey: kubernetes.io/hostname
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
      - name: watcher-harbor-registry-secret
      containers:
      - name: jcode-generator
        image: harbor.jbnu.ac.kr/jdevops/jcode-generator:REPLACE_WITH_COMMIT_SHA
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: jcode-generator-configmap
        - secretRef:
            name: jcode-generator-secret
        env:
        - name: CONTROLLER_MODE
          value: "workspace"
        - name: JCODE_ENVIRONMENT
          value: "prod"
        - name: REQUEST_NAMESPACE_PREFIX
          value: "jcode-"
        - name: COURSE_NAMESPACE_PREFIX
          value: "jcode-"
        - name: NFS_MOUNT_PATH
          value: "/nfs-data"
        volumeMounts:
        - name: workspace-storage
          mountPath: /nfs-data
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: 200m
            memory: 1.5Gi
          limits:
            memory: 2Gi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: workspace-storage
        persistentVolumeClaim:
          claimName: jcode-vol-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: jcode-generator-svc
  namespace: watcher
  labels:
    app: jcode-generator
spec:
  type: ClusterIP
  selector:
    app: jcode-generator
  ports:
  - name: generator
    port: 5000
    targetPort: 5000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jcode-workspace-backend-only
  namespace: watcher
spec:
  podSelector:
    matchLabels:
      app: jcode-generator
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: jcode-backend
    ports:
    - protocol: TCP
      port: 5000
  policyTypes: ["Ingress"]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: jcode-generator-monitor
  namespace: watcher
  labels:
    app: jcode-generator
    release: prometheus
spec:
  selector:
    matchLabels:
      app: jcode-generator
  namespaceSelector:
    matchNames:
      - watcher
  endpoints:
    - port: generator
      path: /metrics
      interval: 30s
