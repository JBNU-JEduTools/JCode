[supervisord]
nodaemon=true

[program:code-server]
user=coder
command=/bin/sh -c 'cd /home/coder/project && exec /usr/local/bin/code-server --bind-addr=0.0.0.0:8080 --auth none ${CODE_SERVER_EXTRA_ARGS}'
priority=10
autorestart=true
stdout_logfile=/logs/code-server.log
stderr_logfile=/logs/code-server_err.log
startsecs=5

[program:vncserver]
user=coder
command=/bin/sh -c 'while ! nc -z 127.0.0.1 8080; do sleep 1; done; exec /usr/bin/vncserver :1 -geometry 1280x800 -depth 24 -SecurityTypes None && tail -f /home/coder/.vnc/*:1.log'
priority=20
autorestart=true
stdout_logfile=/logs/vncserver.log
stderr_logfile=/logs/vncserver_err.log
startsecs=3

[program:openbox]
user=coder
environment=DISPLAY=":1",HOME="/home/coder"
command=/bin/sh -c 'while ! nc -z 127.0.0.1 5901; do sleep 1; done; exec openbox-session'
priority=30
autorestart=true
stdout_logfile=/logs/openbox.log
stderr_logfile=/logs/openbox_err.log
startsecs=3

[program:websockify]
user=coder
command=/bin/sh -c 'while ! nc -z 127.0.0.1 5901; do sleep 1; done; exec /usr/bin/websockify --web=/usr/share/novnc 6080 localhost:5901'
priority=40
autorestart=true
stdout_logfile=/logs/websockify.log
stderr_logfile=/logs/websockify_err.log
startsecs=3
