apiVersion: v1
kind: ServiceAccount
metadata:
  name: jcode-secret-reader
  namespace: watcher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jcode-harbor-secret-reader
  namespace: watcher
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["watcher-harbor-registry-secret"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jcode-harbor-secret-reader
  namespace: watcher
subjects:
- kind: ServiceAccount
  name: jcode-secret-reader
  namespace: watcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jcode-harbor-secret-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jcode-external-secret-reviewer
rules:
- apiGroups: ["authorization.k8s.io"]
  resources: ["selfsubjectrulesreviews"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jcode-external-secret-reviewer
subjects:
- kind: ServiceAccount
  name: jcode-secret-reader
  namespace: watcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: jcode-external-secret-reviewer
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: jcode-harbor-pull-secret
spec:
  provider:
    kubernetes:
      remoteNamespace: watcher
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: watcher
      auth:
        serviceAccount:
          name: jcode-secret-reader
          namespace: watcher
