apiVersion: v1
kind: ConfigMap
metadata:
  name: jcode-generator-configmap
  namespace: watcher
data:
  ALGORITHM: "HS256"
  NFS_SERVER: "your.nfs.server.address"
  NFS_PATH: "/yourPath"
  NFS_MOUNT_PATH: "/nfs-data"
  WORKSPACE_EXTENSIONS_DIR: "extensions-v2"
  SNAPSHOT_NFS_SERVER: "your.nfs.snapshot.server.address"
  SNAPSHOT_NFS_PATH: "/yourSnapshotPath"
  SERVICE_ACCOUNT: "jcode-workload"
  HARBOR_REGISTRY: "harbor.jedutools.io"
  CODE_SERVER_IMAGE: "harbor.jedutools.io/jdevops/code-server:0123456789abcdef"
  WORKSPACE_RESOURCE_PROFILES_JSON: '{"STANDARD":{"requests":{"cpu":"200m","memory":"256Mi"},"limits":{"cpu":"4","memory":"2Gi"}},"HIGH_MEMORY":{"requests":{"cpu":"500m","memory":"1Gi"},"limits":{"cpu":"4","memory":"8Gi"}},"GPU":{"requests":{"cpu":"1","memory":"2Gi","nvidia.com/gpu":"1"},"limits":{"cpu":"4","memory":"8Gi","nvidia.com/gpu":"1"}}}'
  CODE_SERVER_VNC_IMAGE: "harbor.jedutools.io/jdevops/code-server-vnc:0123456789abcdef"
  WORKSPACE_INIT_IMAGE: "harbor.jedutools.io/jdevops/workspace-init:0123456789abcdef"
  IMAGE_PULL_POLICY: "IfNotPresent"
  IMAGE_PULL_SECRET_NAMES: "watcher-harbor-registry-secret"
  IMAGE_PULL_SECRET_REMOTE_NAMES: "watcher-harbor-registry-secret"
  EXTERNAL_SECRET_STORE_NAME: "jcode-harbor-pull-secret"
  EXTERNAL_SECRET_STORE_KIND: "ClusterSecretStore"
  IMAGE_PULL_SECRET_READY_TIMEOUT_SECONDS: "60"
  CODE_SERVER_ARGS: "/home/coder/project"
  CODE_SERVER_VNC_ARGS: "/home/coder/project"
  WORKSPACE_ROOT: "/home/coder/project"
  WATCHER_NAMESPACE: "watcher"
  WATCHER_API_BASE: "http://watcher-backend-service.watcher.svc.cluster.local:3000"
  WORKSPACE_DNS_CIDRS: "replace-with-cluster-dns-cidr"
  WORKSPACE_PROXY_URL: "http://jcode-router-svc.watcher.svc.cluster.local:3000"
  WORKSPACE_PROXY_NAMESPACE: "watcher"
  WORKSPACE_PROXY_POD_LABEL: "jcode-router"
  WORKSPACE_PROXY_PORT: "3000"
  WORKSPACE_NO_PROXY: "localhost,127.0.0.1,.svc,.cluster.local,watcher-backend-service.watcher.svc.cluster.local"
  STARTER_ZIP_MAX_BYTES: "52428800"
  STARTER_ZIP_MAX_UNCOMPRESSED_BYTES: "209715200"
  STARTER_ZIP_MAX_FILES: "1000"
  NAMESPACE_DELETE_TIMEOUT_SECONDS: "60"
  NAMESPACE_DELETE_POLL_SECONDS: "2"
---
apiVersion: v1
kind: Secret
metadata:
  name: jcode-generator-secret
  namespace: watcher
type: Opaque
data:
  GENERATOR_SERVICE_SECRET: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=" # 32-byte example; replace through Secret manager
