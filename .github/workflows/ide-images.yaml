name: JCode IDE images

on:
  workflow_dispatch:
    inputs:
      base_digest:
        description: "CodeServer base digest"
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: harbor.jbnu.ac.kr
  PROJECT: jdevops

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Verify CodeServer base image
        env:
          BASE_DIGEST: ${{ inputs.base_digest }}
        run: |
          [[ "$BASE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "${REGISTRY}/${PROJECT}/jcode-codeserver@${BASE_DIGEST}"
      - name: Build JCode IDE image
        id: ide
        uses: docker/build-push-action@v6
        with:
          context: image/code-server
          push: true
          build-args: JCODE_CODE_SERVER_BASE=${{ env.REGISTRY }}/${{ env.PROJECT }}/jcode-codeserver@${{ inputs.base_digest }}
          tags: ${{ env.REGISTRY }}/${{ env.PROJECT }}/code-server:${{ github.sha }}
          provenance: true
          sbom: true
      - name: Build JCode VNC image
        id: vnc
        uses: docker/build-push-action@v6
        with:
          context: image/code-server-vnc
          push: true
          build-args: JCODE_CODE_SERVER_BASE=${{ env.REGISTRY }}/${{ env.PROJECT }}/jcode-codeserver@${{ inputs.base_digest }}
          tags: ${{ env.REGISTRY }}/${{ env.PROJECT }}/code-server-vnc:${{ github.sha }}
          provenance: true
          sbom: true
      - name: Record immutable image digests
        run: |
          echo 'ide=${{ steps.ide.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'vnc=${{ steps.vnc.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
