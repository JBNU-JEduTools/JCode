name: Switch dev controllers

on:
  workflow_call:
    inputs:
      release_run_id:
        description: "Successful dev release run ID"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: jcode-platform-dev
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-22.04
    environment: dev
    env:
      HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY || 'harbor.jedutools.io' }}
    steps:
      - name: Validate dev release
        uses: actions/github-script@v7
        with:
          script: |
            const runId = Number('${{ inputs.release_run_id }}');
            if (!Number.isSafeInteger(runId) || runId <= 0) {
              core.setFailed('release_run_id must be a positive workflow run ID');
              return;
            }
            const {data: run} = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            if (run.event !== 'workflow_dispatch' || run.path !== '.github/workflows/release.yaml' || run.conclusion !== 'success') {
              core.setFailed('cutover requires a successful dev release run');
            }
            if (run.head_branch !== context.payload.repository.default_branch) {
              core.setFailed('release must be started from the default-branch dispatcher');
            }
      - name: Download dev release manifest
        uses: actions/download-artifact@v4
        with:
          name: jcode-release-manifest
          path: ${{ runner.temp }}/release-input
          repository: ${{ github.repository }}
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
      - name: Verify dev release manifest
        id: release_manifest
        run: |
          manifest="${RUNNER_TEMP}/release-input/release-manifest.json"
          jq -e '.schema == 3 and .environment == "dev"' "$manifest" >/dev/null
          jcode_ref=$(jq -er '.revisions.jcode' "$manifest")
          [[ "$jcode_ref" =~ ^[0-9a-f]{40}$ ]]
          echo "jcode_ref=$jcode_ref" >> "$GITHUB_OUTPUT"
      - name: Verify develop revision
        uses: actions/github-script@v7
        env:
          JCODE_REF: ${{ steps.release_manifest.outputs.jcode_ref }}
        with:
          script: |
            const {data: comparison} = await github.rest.repos.compareCommitsWithBasehead({
              owner: context.repo.owner,
              repo: context.repo.repo,
              basehead: `${process.env.JCODE_REF}...develop`,
            });
            if (!['ahead', 'identical'].includes(comparison.status)) {
              core.setFailed('release JCode revision must belong to develop');
            }
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release_manifest.outputs.jcode_ref }}
      - uses: docker/setup-buildx-action@v3
      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - uses: azure/setup-kubectl@v4
      - uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Verify deployed release images
        env:
          BACKEND_NAMESPACE: ${{ vars.BACKEND_NAMESPACE }}
          BACKEND_DEPLOYMENT: ${{ vars.BACKEND_DEPLOYMENT }}
          BACKEND_CONTAINER: ${{ vars.BACKEND_CONTAINER }}
          FRONTEND_NAMESPACE: ${{ vars.FRONTEND_NAMESPACE }}
          FRONTEND_DEPLOYMENT: ${{ vars.FRONTEND_DEPLOYMENT }}
          FRONTEND_CONTAINER: ${{ vars.FRONTEND_CONTAINER }}
          WATCHER_NAMESPACE: ${{ vars.WATCHER_NAMESPACE }}
        run: deploy/verify-release-images.sh "${RUNNER_TEMP}/release-input/release-manifest.json" dev
      - name: Smoke test and switch traffic
        env:
          CONFIRM_DEV_CUTOVER: dev
          BACKEND_NAMESPACE: ${{ vars.BACKEND_NAMESPACE }}
          BACKEND_CONFIGMAP: ${{ vars.BACKEND_CONFIGMAP }}
          BACKEND_DEPLOYMENT: ${{ vars.BACKEND_DEPLOYMENT }}
          CUTOVER_BACKUP_DIR: ${{ runner.temp }}/jcode-dev-cutover-backup
        run: deploy/cutover-dev.sh
      - name: Publish validated release manifest
        uses: actions/upload-artifact@v4
        with:
          name: jcode-validated-release-manifest
          path: ${{ runner.temp }}/release-input/release-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Save cutover backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jcode-dev-cutover-backup
          path: ${{ runner.temp }}/jcode-dev-cutover-backup
          if-no-files-found: warn
          retention-days: 30
